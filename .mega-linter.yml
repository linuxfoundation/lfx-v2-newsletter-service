---
GITHUB_COMMENT_REPORTER: false
DISABLE_LINTERS:
  - KUBERNETES_KUBECONFORM
  - KUBERNETES_KUBESCAPE
  - SPELL_LYCHEE
  - YAML_PRETTIER
DISABLE_ERRORS_LINTERS:
  # There's no easy local feedback loop for spelling issues before
  # pushing, so keep them non-blocking to avoid unnecessary PR cycles
  # for words that just need adding to the dictionary.
  - SPELL_CSPELL
  - COPYPASTE_JSCPD
  - REPOSITORY_TRIVY
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
YAML_YAMLLINT_CONFIG_FILE: .yamllint
REPOSITORY_KICS_ARGUMENTS: scan --no-progress --exclude-severities="medium,low,info,trace"
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
SPELL_CSPELL_PRE_COMMANDS:
  - command: >-
      cp .cspell.json /tmp/cspell.json.orig &&
      curl -sSf --connect-timeout 5 --max-time 15
      https://raw.githubusercontent.com/linuxfoundation/lfx-public-workflows/a93335d2abc2a2e2bb1b7a4cdefbbf15351681ce/cspell/flagwords.json.snippet
      -o /tmp/flagwords.json.snippet &&
      sed -i -e '/"flagWords": \[\]/{r /tmp/flagwords.json.snippet' -e 'd}' .cspell.json
    cwd: "workspace"
    continue_if_failed: false
SPELL_CSPELL_POST_COMMANDS:
  - command: cp /tmp/cspell.json.orig .cspell.json
    cwd: "workspace"
SPELL_VALE_PRE_COMMANDS:
  - command: mkdir -p styles
    cwd: "workspace"
  - command: vale sync
    cwd: "workspace"
FILTER_REGEX_EXCLUDE: '(templates/.*\.yml|templates/.*\.yaml)'
KUBERNETES_DIRECTORY: charts/lfx-v2-newsletter-service/templates
KUBERNETES_HELM_ARGUMENTS: charts/lfx-v2-newsletter-service
