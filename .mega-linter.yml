---
GITHUB_COMMENT_REPORTER: false
DISABLE_LINTERS:
  - KUBERNETES_KUBECONFORM
  - KUBERNETES_KUBESCAPE
  - SPELL_LYCHEE
  - YAML_PRETTIER
DISABLE_ERRORS_LINTERS:
  # There's no easy local feedback loop for spelling issues before
  # pushing, so keep them non-blocking to avoid unnecessary PR cycles
  # for words that just need adding to the dictionary.
  - SPELL_CSPELL
  - COPYPASTE_JSCPD
  - REPOSITORY_TRIVY
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
YAML_YAMLLINT_CONFIG_FILE: .yamllint
# zizmor's online audits (impostor-commit, known-vulnerable-actions,
# ref-confusion) query the GitHub API, which requires GITHUB_TOKEN.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
SPELL_CSPELL_PRE_COMMANDS:
  - command: >-
      cp .cspell.json /tmp/cspell.json.orig &&
      curl -sSf --connect-timeout 5 --max-time 15
      https://raw.githubusercontent.com/linuxfoundation/lfx-public-workflows/737873e045a02df2f66b09d8061b98997cdf1880/cspell/flagwords.json.snippet
      -o /tmp/flagwords.json.snippet &&
      test "$(grep -c '^[[:space:]]*"flagWords"[[:space:]]*:[[:space:]]*\[\],[[:space:]]*$' .cspell.json)" -eq 1 &&
      sed -i -e '/^[[:space:]]*"flagWords"[[:space:]]*:[[:space:]]*\[\],[[:space:]]*$/{r /tmp/flagwords.json.snippet' -e 'd}' .cspell.json &&
      ! grep -qF '"flagWords": []' .cspell.json
    cwd: "workspace"
    continue_if_failed: false
SPELL_CSPELL_POST_COMMANDS:
  - command: cp /tmp/cspell.json.orig .cspell.json
    cwd: "workspace"
SPELL_VALE_PRE_COMMANDS:
  - command: mkdir -p styles
    cwd: "workspace"
  - command: vale sync
    cwd: "workspace"
# Exclude Helm chart templates (Go-templated yaml) and the declarative
# newsletter templates (a custom JSX-like DSL, not real HTML) from linting.
FILTER_REGEX_EXCLUDE: '(templates/.*\.yml|templates/.*\.yaml|internal/service/render/declarative/templates/.*\.html)'
KUBERNETES_DIRECTORY: charts/lfx-v2-newsletter-service/templates
KUBERNETES_HELM_ARGUMENTS: charts/lfx-v2-newsletter-service
