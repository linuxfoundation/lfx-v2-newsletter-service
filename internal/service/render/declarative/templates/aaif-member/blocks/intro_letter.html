<!--
  Opening letter from the Executive Director to members: a greeting, a few
  paragraphs on the theme of the week, and a sign-off. Set in a serif at a
  larger size, as the one personal voice in the newsletter.
-->
<Section style="width:100%;max-width:640px;margin:0 auto 20px">
  <div style="padding:4px 20px 0">
    <Heading if="title" class="dm-h" style="margin:0 0 12px;font-family:Georgia,'Times New Roman',Times,serif;font-size:26px;font-weight:bold;line-height:1.25;color:#111111">{{title}}</Heading>
    <Text if="greeting" class="dm-t" style="margin:0 0 12px;font-family:Georgia,'Times New Roman',Times,serif;font-size:18px;line-height:1.6;color:#333338">{{greeting}}</Text>
    <richtext field="body" class="dm-t" style="font-family:Georgia,'Times New Roman',Times,serif;font-size:18px;line-height:1.6;color:#333338" />
    <Text if="signoff" class="dm-t" style="margin:14px 0 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:18px;line-height:1.6;color:#333338">{{signoff}}</Text>
    <Text if="signature" class="dm-h" style="margin:2px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;line-height:1.5;color:#111111">{{signature}}</Text>
    <Text if="signature_title" class="dm-m" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#6b6b70">{{signature_title}}</Text>
  </div>
</Section>
