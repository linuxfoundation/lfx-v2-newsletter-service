<!-- SCHEMA: {
  "section_title": {"type":"text","label":"Eyebrow label"},
  "title": {"type":"text","label":"Title"},
  "description": {"type":"richtext","label":"Description"},
  "link": {"type":"text","label":"Link URL"},
  "link_text": {"type":"text","label":"Link text"}
} -->
<Section style="padding:0 15px">
  <Text if="section_title" style="margin:0 0 4px;font-size:12px;color:#4086c6;font-weight:bold;text-transform:uppercase">{{section_title}}</Text>
  <Heading if="title" class="brick-title">{{title}}</Heading>
  <richtext field="description" class="body" />
  <Text if="link" class="body" style="margin-top:8px">
    <strong><Link href="{{link}}" class="link">{{link_text}}</Link></strong>
  </Text>
  <Hr class="divider" />
</Section>
