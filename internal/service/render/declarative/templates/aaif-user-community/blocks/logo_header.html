<!-- CATEGORY: navigation -->
<!-- SCHEMA: {
  "image_url": {"type":"image","label":"Banner image URL","default":""},
  "image_alt": {"type":"text","label":"Logo alt text (accessibility)","default":"Organization logo"},
  "brand_label": {"type":"text","label":"Brand label (right side)","default":""},
  "link": {"type":"text","label":"Link URL","default":""}
} -->
<Section style="padding:16px 24px">
  <Row>
    <Column style="width:50%;vertical-align:middle">
      <Link href="{{link}}"><Img if="image_url" src="{{image_url}}" alt="{{image_alt}}" width="98px" style="display:block;border:0" /></Link>
    </Column>
    <Column style="width:50%;vertical-align:middle;text-align:right">
      <Text if="brand_label" style="margin:0;font-size:13px;color:#7B7D81;text-align:right">{{brand_label}}</Text>
    </Column>
  </Row>
</Section>
