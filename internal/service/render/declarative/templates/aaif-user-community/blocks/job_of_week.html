<!-- SCHEMA: { "header_title":{"type":"text","label":"Header"}, "jobs":{"type":"array","label":"Jobs","fields":{"job_title":{"type":"text"},"company":{"type":"text"},"location":{"type":"text"},"apply_link":{"type":"text"},"description":{"type":"richtext"}}}, "jobs_board_url":{"type":"text","label":"Jobs board URL"} } -->
<Section style="background-color:#d7d7d7;border-collapse:separate;border-radius:15px;width:650px;max-width:650px;margin:0 auto 20px;color:#000">
  <div style="padding:15px">
    <Text class="eyebrow">{{header_title}}</Text>
    <div each="jobs" style="margin:0 0 16px">
      <Text style="margin:0 0 10px 0;font-size:18px;font-weight:bold;color:#000"><Link href="{{apply_link}}" class="link">{{job_title}}</Link> // {{company}} // {{location}}</Text>
      <richtext field="description" class="body" />
    </div>
  </div>
</Section>
