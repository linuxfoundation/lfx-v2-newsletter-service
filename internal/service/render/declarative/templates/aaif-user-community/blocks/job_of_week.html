<!-- SCHEMA: {
  "header_title": {"type":"text","label":"Header","default":"JOB OF THE WEEK"},
  "jobs": {"type":"array","label":"Jobs","fields":{
    "job_title":{"type":"text","label":"Role"},
    "company":{"type":"text","label":"Company"},
    "location":{"type":"text","label":"Location"},
    "apply_link":{"type":"text","label":"Apply link"},
    "description":{"type":"richtext","label":"Description (blurb + responsibilities/requirements)"}
  }},
  "jobs_board_url": {"type":"text","label":"Jobs board URL"}
} -->
<!-- Style C JOB OF THE WEEK — role header + blurb; use the richtext description for responsibilities/requirements lists. -->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:22px 22px 10px">
    <Text class="dm-h" style="margin:0 0 14px;color:#131313;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;line-height:1"><span class="dm-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background-color:#131313;vertical-align:middle;font-size:0;line-height:0">&nbsp;</span><span class="dm-dot" style="display:inline-block;width:9px;height:9px;background-color:#131313;vertical-align:middle;margin:0 12px 0 5px;font-size:0;line-height:0">&nbsp;</span>{{header_title}}</Text>
    <div each="jobs" style="margin:0 0 16px">
      <Text class="dm-h" style="font-size:18px;line-height:1.4;margin:0 0 10px;font-weight:bold;color:#131313"><Link href="{{apply_link}}" class="dm-h" style="color:#131313;text-decoration:underline">{{job_title}}</Link> <span class="dm-m" style="color:#77777c;font-weight:normal">// {{company}} // {{location}}</span></Text>
      <richtext field="description" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5" />
    </div>
    <Text if="jobs_board_url" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 8px"><strong><Link href="{{jobs_board_url}}" class="dm-h" style="color:#131313;text-decoration:underline">See more roles →</Link></strong></Text>
  </div>
</Section>
