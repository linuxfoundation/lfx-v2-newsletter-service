<!-- SCHEMA: {
  "heading": {"type":"text","label":"Heading (eyebrow)"},
  "title": {"type":"text","label":"Title"},
  "body": {"type":"richtext","label":"Body"},
  "useful_links": {"type":"array","label":"Useful links","fields":{
    "title":{"type":"text","label":"Link title"},
    "url":{"type":"text","label":"URL"},
    "description":{"type":"text","label":"Description"}
  }}
} -->
<Section class="card">
  <div style="padding:15px 15px 10px">
    <Text if="heading" class="eyebrow">{{heading}}</Text>
    <Heading if="title" class="title">{{title}}</Heading>
    <richtext field="body" class="body" />
    <div if="useful_links">
      <Hr style="border:0;border-top:1px solid #bbb;margin:16px 0" />
      <Heading style="margin:0 0 8px;font-size:24px;font-weight:bold;color:#000">Useful links</Heading>
      <Text each="useful_links" class="body" style="margin:0 0 12px">
        <strong><Link href="{{url}}" class="link">{{title}}</Link></strong> {{description}}
      </Text>
    </div>
  </div>
</Section>
