<!-- SCHEMA: {
  "title": {"type":"text","label":"Title"},
  "story": {"type":"richtext","label":"Story"},
  "confess_link": {"type":"text","label":"Confession form link"}
} -->
<!--
  Style C AGENT CONFESSIONS. Block KEY stays `ml_confessions` to match the MLOps
  Community repo one-for-one; only the visible eyebrow reads "AGENT CONFESSIONS".
-->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:22px 22px 14px">
    <Text class="dm-h" style="margin:0 0 14px;color:#131313;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;line-height:1"><span class="dm-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background-color:#131313;vertical-align:middle;font-size:0;line-height:0">&nbsp;</span><span class="dm-dot" style="display:inline-block;width:9px;height:9px;background-color:#131313;vertical-align:middle;margin:0 12px 0 5px;font-size:0;line-height:0">&nbsp;</span>AGENT CONFESSIONS</Text>
    <Heading if="title" class="dm-h" style="margin:0 0 8px;font-size:26px;font-weight:bold;color:#131313;line-height:1.15;letter-spacing:-0.3px">{{title}}</Heading>
    <richtext field="story" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5" />
    <Text class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin-top:12px">Share your confession <strong><Link href="{{confess_link}}" class="dm-h" style="color:#131313;text-decoration:underline">here</Link></strong>.</Text>
  </div>
</Section>
