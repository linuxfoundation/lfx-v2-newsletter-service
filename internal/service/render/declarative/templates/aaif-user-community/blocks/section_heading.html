<!-- SCHEMA: {
  "title":    {"type":"text","label":"Section title"},
  "subtitle": {"type":"text","label":"Subtitle"}
} -->
<!-- CATEGORY: structure -->

<!--
  The uppercase section divider between the newsletter's topic groups
  (NEWS, MILESTONES, IN THE NEWS, SECURITY, ...). The optional subtitle
  covers two-level headings like "AI / NEWS & VIEWS".
-->

<Section style="padding:0 15px">
  <Heading style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;line-height:1.4;color:#000;text-transform:uppercase;letter-spacing:0.5px;padding:18px 0 4px">{{title}}</Heading>
  <Text if="subtitle" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:14px;line-height:1.4;color:#000;text-transform:uppercase;letter-spacing:0.5px;padding:0 0 4px">{{subtitle}}</Text>
</Section>
