<!-- SCHEMA: {
  "title": {"type":"text","label":"Title"},
  "question": {"type":"richtext","label":"Question"},
  "options": {"type":"array","label":"Answer options","fields":{
    "label":{"type":"text","label":"Answer label (e.g. 'A · Around 4,000')"},
    "url":{"type":"text","label":"Tracked link"}
  }},
  "footnote": {"type":"text","label":"Footnote"}
} -->
<!-- Style C AGENT TRIVIA — quiz: each answer is a tracked outline button. -->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:22px 22px 12px">
    <Text class="dm-h" style="margin:0 0 14px;color:#131313;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;line-height:1"><span class="dm-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background-color:#131313;vertical-align:middle;font-size:0;line-height:0">&nbsp;</span><span class="dm-dot" style="display:inline-block;width:9px;height:9px;background-color:#131313;vertical-align:middle;margin:0 12px 0 5px;font-size:0;line-height:0">&nbsp;</span>AGENT TRIVIA</Text>
    <Heading if="title" class="dm-h" style="margin:0 0 8px;font-size:26px;font-weight:bold;color:#131313;line-height:1.15;letter-spacing:-0.3px">{{title}}</Heading>
    <richtext field="question" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 16px" />
    <div each="options" style="padding:0 0 8px">
      <Button href="{{url}}" class="dm-outline" style="display:block;background-color:#ffffff;border:1px solid #c9c9cc;color:#131313;font-weight:bold;text-decoration:none;text-align:center;padding:12px 18px;border-radius:8px;line-height:120%">{{label}}</Button>
    </div>
    <Text if="footnote" class="dm-m" style="font-size:13px;color:#77777c;line-height:1.5;margin:6px 0 10px;text-align:center">{{footnote}}</Text>
  </div>
</Section>
