<!-- SCHEMA: {
  "name":  {"type":"text","label":"Name","default":"Jim Zemlin"},
  "title": {"type":"text","label":"Title","default":"CEO, The Linux Foundation"}
} -->
<!-- CATEGORY: letter -->

<!--
  The letter's closing signature block: name on one line, role on the next,
  separated from the body by a short rule, matching the email's sign-off.
-->

<Section style="padding:0 15px">
  <hr style="width:120px;border-color:#cccccc;border-width:1px;padding:12px 0 0" />
  <Text style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#000;padding:8px 0 0">{{name}}</Text>
  <Text if="title" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:14px;line-height:1.4;color:#555;padding:0 0 12px">{{title}}</Text>
</Section>
