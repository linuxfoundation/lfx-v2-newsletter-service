<!-- SCHEMA: {
  "eyebrow": {"type":"text","label":"Eyebrow label","default":"FEATURE"},
  "title": {"type":"text","label":"Title"},
  "intro": {"type":"richtext","label":"Intro"},
  "links": {"type":"array","label":"Guide links","fields":{
    "title":{"type":"text","label":"Link title"},
    "url":{"type":"text","label":"URL"},
    "description":{"type":"richtext","label":"Description"}
  }},
  "sub_title": {"type":"text","label":"Sub-section title (below divider)"},
  "sub_body": {"type":"richtext","label":"Sub-section body"},
  "cta_text": {"type":"text","label":"CTA button text"},
  "cta_link": {"type":"text","label":"CTA button link"}
} -->
<!-- Style C FEATURE — long-form: intro, titled link list, divider, event plug + CTA button. -->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:22px">
    <Text class="dm-h" style="margin:0 0 14px;color:#131313;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;line-height:1"><span class="dm-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background-color:#131313;vertical-align:middle;font-size:0;line-height:0">&nbsp;</span><span class="dm-dot" style="display:inline-block;width:9px;height:9px;background-color:#131313;vertical-align:middle;margin:0 12px 0 5px;font-size:0;line-height:0">&nbsp;</span>{{eyebrow}}</Text>
    <Heading if="title" class="dm-h" style="margin:0 0 8px;font-size:26px;font-weight:bold;color:#131313;line-height:1.15;letter-spacing:-0.3px">{{title}}</Heading>
    <richtext field="intro" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 16px" />
    <div each="links" style="margin:0 0 14px">
      <Text class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 4px"><strong><Link href="{{url}}" class="dm-h" style="color:#131313;text-decoration:underline">{{title}}</Link></strong></Text>
      <richtext field="description" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0" />
    </div>
    <Hr if="sub_title" class="dm-rule" style="width:100%;border:0;border-top:1px solid #d8d8db;margin:4px 0 16px" />
    <Text if="sub_title" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 8px"><strong>{{sub_title}}</strong></Text>
    <richtext field="sub_body" class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 16px" />
    <Button if="cta_text" href="{{cta_link}}" class="dm-btn dm-btn-a" style="display:inline-block;background-color:#131313;color:#ffffff;font-weight:bold;text-decoration:none;padding:11px 22px;border-radius:8px;line-height:120%">{{cta_text}}</Button>
  </div>
</Section>
