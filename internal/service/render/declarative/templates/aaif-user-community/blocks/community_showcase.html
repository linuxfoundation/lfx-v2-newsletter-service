<!-- SCHEMA: {
  "title": {"type":"text","label":"Title"},
  "project_name": {"type":"text","label":"Project name"},
  "project_url": {"type":"text","label":"Project link"},
  "description": {"type":"text","label":"Description (inline, follows the name)"},
  "byline": {"type":"text","label":"Byline / stats"},
  "cta_text": {"type":"text","label":"CTA button text","default":"Submit your project →"},
  "cta_link": {"type":"text","label":"CTA button link"}
} -->
<!-- Style C COMMUNITY SHOWCASE — featured reader project + submit CTA. -->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:22px">
    <Text class="dm-h" style="margin:0 0 14px;color:#131313;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;line-height:1"><span class="dm-dot" style="display:inline-block;width:9px;height:9px;background-color:#131313;vertical-align:middle;font-size:0;line-height:0">&nbsp;</span><span class="dm-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background-color:#131313;vertical-align:middle;margin:0 12px 0 5px;font-size:0;line-height:0">&nbsp;</span>COMMUNITY SHOWCASE</Text>
    <Heading if="title" class="dm-h" style="margin:0 0 8px;font-size:26px;font-weight:bold;color:#131313;line-height:1.15;letter-spacing:-0.3px">{{title}}</Heading>
    <Text class="dm-t" style="font-size:16px;color:#3c3c3f;line-height:1.5;margin:0 0 8px"><strong><Link href="{{project_url}}" class="dm-h" style="color:#131313;text-decoration:underline">{{project_name}}</Link></strong> {{description}}</Text>
    <Text if="byline" class="dm-m" style="font-size:14px;color:#77777c;line-height:1.5;margin:0 0 16px">{{byline}}</Text>
    <Button if="cta_text" href="{{cta_link}}" class="dm-btn dm-btn-a" style="display:inline-block;background-color:#131313;color:#ffffff;font-weight:bold;text-decoration:none;padding:11px 22px;border-radius:8px;line-height:120%">{{cta_text}}</Button>
  </div>
</Section>
