<!-- SCHEMA: { "children": {"type":"slot","label":"Bricks"} } -->
<!--
  AAIF COMMUNITY — slot block. Block KEY stays `mlops_community` so it matches
  the MLOps Community repo one-for-one (both newsletters share the brick set);
  only the visible eyebrow label reads "AAIF COMMUNITY".

  Brick layout:
    - Each brick renders inside a <Section class="brick" style="padding:0">.
    - A divider renders BETWEEN bricks (not before the first, not after the
      last) via the <separator> child of <slot>. Each separator is an
      inline-styled <Hr> — email-safe across Gmail / Apple Mail / Outlook.
    - The card's horizontal inset lives here; bricks use padding:0 so they
      don't double-indent.
-->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:22px 22px 10px">
    <Text class="dm-h" style="margin:0 0 14px;color:#131313;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;line-height:1"><span class="dm-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background-color:#131313;vertical-align:middle;font-size:0;line-height:0">&nbsp;</span><span class="dm-dot" style="display:inline-block;width:9px;height:9px;background-color:#131313;vertical-align:middle;margin:0 12px 0 5px;font-size:0;line-height:0">&nbsp;</span>AAIF COMMUNITY</Text>
    <slot name="children">
      <separator><Hr class="dm-rule" style="border:0;border-top:1px solid #d8d8db;margin:0 0 16px" /></separator>
    </slot>
  </div>
</Section>
