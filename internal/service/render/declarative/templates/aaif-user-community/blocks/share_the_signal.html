<!-- SCHEMA: {
  "title": {"type":"text","label":"Title"},
  "subtitle": {"type":"text","label":"Subtitle"},
  "subscribe_text": {"type":"text","label":"Subscribe button text","default":"Subscribe link →"},
  "subscribe_link": {"type":"text","label":"Subscribe link"},
  "share_text": {"type":"text","label":"Share button text","default":"Share on X"},
  "share_url": {"type":"text","label":"Share (tweet-intent) URL"}
} -->
<!-- Style C SHARE THE SIGNAL — referral: subscribe + share-on-X buttons. -->
<Section class="dm-card" style="width:100%;max-width:650px;margin:0 auto 24px;background-color:#ffffff;border:1px solid #131313;border-collapse:separate;border-radius:14px;box-shadow:6px 6px 0 #131313;color:#131313">
  <div style="padding:28px 32px;text-align:center">
    <Heading if="title" class="dm-h" style="margin:0 0 8px;font-size:24px;font-weight:bold;color:#131313;line-height:1.2;letter-spacing:-0.3px">{{title}}</Heading>
    <Text if="subtitle" class="dm-m" style="font-size:15px;color:#77777c;line-height:1.5;margin:0 0 18px">{{subtitle}}</Text>
    <Row>
      <Column style="text-align:center;padding:0 5px;vertical-align:top">
        <Button href="{{subscribe_link}}" class="dm-btn dm-btn-a" style="display:inline-block;background-color:#131313;color:#ffffff;font-weight:bold;text-decoration:none;padding:11px 20px;border-radius:8px;line-height:120%">{{subscribe_text}}</Button>
      </Column>
      <Column style="text-align:center;padding:0 5px;vertical-align:top">
        <Button href="{{share_url}}" class="dm-outline" style="display:inline-block;background-color:#ffffff;border:1px solid #c9c9cc;color:#131313;font-weight:bold;text-decoration:none;padding:10px 20px;border-radius:8px;line-height:120%">{{share_text}}</Button>
      </Column>
    </Row>
  </div>
</Section>
