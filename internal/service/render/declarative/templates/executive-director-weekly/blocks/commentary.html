<!-- SCHEMA: {
  "title": {"type":"text","label":"Title"},
  "body":  {"type":"richtext","label":"Commentary"}
} -->
<!-- CATEGORY: letter -->

<!--
  A free-flowing editorial passage in the Executive Director's voice, used
  where a section carries prose rather than bulleted items (e.g. the small
  models essay under TECH NEWS THAT MATTERS). The optional title renders in
  the same uppercase style as section headings.
-->

<Section style="padding:0 15px">
  <Heading if="title" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:17px;line-height:1.4;color:#000;text-transform:uppercase;letter-spacing:0.5px;padding:18px 0 4px">{{title}}</Heading>
  <richtext field="body" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#000;padding:6px 0" />
</Section>
