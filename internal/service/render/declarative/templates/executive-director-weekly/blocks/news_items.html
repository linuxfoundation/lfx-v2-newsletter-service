<!-- SCHEMA: {
  "items": {"type":"array","label":"News items","fields":{
    "headline":     {"type":"text","label":"Headline"},
    "summary":      {"type":"richtext","label":"Summary"},
    "source_label": {"type":"text","label":"Source label"},
    "source_url":   {"type":"text","label":"Source URL"}
  }}
} -->
<!-- CATEGORY: news -->

<!--
  The bulleted item list used by every topic section of the Executive
  Director weekly: each item leads with a bold headline, carries a summary
  with inline links, and closes with a source attribution link. Items with
  more than one source put the extra links inside the summary richtext,
  which matches how the letter is written today.
-->

<Section style="padding:0 15px">
  <div each="items" style="padding:0 0 12px 12px">
    <Text if="headline" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#000;padding:0"><strong>{{headline}}</strong></Text>
    <richtext field="summary" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#000;padding:2px 0 0" />
    <Text if="source_url" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:14px;line-height:1.4;padding:2px 0 0"><Link href="{{source_url}}" style="color:#1155cc;text-decoration:underline">{{source_label}}</Link></Text>
  </div>
</Section>
