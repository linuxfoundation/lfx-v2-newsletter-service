<!--
  Default newsletter wrapper.

  Project-neutral header / footer chrome that mirrors the legacy (non-blocks)
  LFX newsletter template (internal/service/render/email_chrome.go): a blue
  header band carrying the "<project> · Newsletter" eyebrow and the edition
  subject, the edition body, and the gray compliance footer.

  The declarative renderer compiles to MJML, whose section-band model can't
  reproduce every pixel of the hand-authored table chrome — there is no single
  rounded 680px card container, no gray page gutter, and MJML sections take a
  solid background rather than the legacy's blue gradient. The colors, header
  treatment, subject, and compliance footer match; the framing is band-based.

  Runtime fields use {{mustache}}, each guarded with if= so an empty field drops
  its row. edition.title carries the newsletter subject; edition.project_name is
  a send-time sentinel (%%PROJECT_NAME%%) substituted per send.
-->

<Section style="background-color:#3B82F6;padding:28px 24px">
  <Text style="padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#FFFFFF">{{edition.project_name}} &middot; Newsletter</Text>
  <Text if="edition.title" style="padding:8px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;font-size:22px;font-weight:700;line-height:1.3;color:#FFFFFF">{{edition.title}}</Text>
</Section>

<slot name="body" />

<Section style="background-color:#F9FAFB;border-top:1px solid #E5E7EB;padding:24px">
  <Text if="edition.sender_name" style="padding:0 0 6px 0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;font-size:12px;color:#6B7280">
    Sent by {{edition.sender_name}}<span if="edition.project_name"> on behalf of {{edition.project_name}}</span>.
  </Text>
  <Text if="edition.reply_email" style="padding:0 0 6px 0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;font-size:12px;color:#6B7280">
    To reply, email <Link href="mailto:{{edition.reply_email}}" style="color:#6B7280;text-decoration:underline">{{edition.reply_email}}</Link>
  </Text>
  <Text style="padding:0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;font-size:12px;color:#9CA3AF">
    <span if="edition.unsubscribe_url">
      <Link clicktracking="off" href="{{edition.unsubscribe_url}}" style="color:#9CA3AF;text-decoration:underline">Unsubscribe</Link>
      <span if="edition.manage_subscriptions_url">
        &middot;
        <Link clicktracking="off" href="{{edition.manage_subscriptions_url}}" style="color:#9CA3AF;text-decoration:underline">Manage your email preferences</Link>
      </span>
      &middot;
    </span>
    <span if="edition.unsubscribe_fallback">{{edition.unsubscribe_fallback}} &middot; </span>
    Delivered by LFX.
  </Text>
</Section>
