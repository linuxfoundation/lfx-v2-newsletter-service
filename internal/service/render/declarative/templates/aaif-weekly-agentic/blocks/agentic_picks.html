<!--
  Agentic Picks — an AI-researched section: from the week's posts across LF
  foundations and projects (Content → Sources), the newsletter-agentic-picks
  recipe picks the 3-5 that matter most to people building open agents and
  writes a 25-45 word summary for each. Links always come from the source
  post, never from the model. Uses the shared bullet-section layout. Not in
  edition.json by default because each run is an AI call; add it from the
  palette when wanted.
-->
<Section style="width:100%;max-width:640px;margin:0 auto 8px">
  <div style="padding:0 20px">
    <Hr class="dm-rule-strong" style="border:0;border-top:2px solid #111111;margin:0 0 10px" />
    <Text class="dm-h" style="margin:0 0 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;letter-spacing:2.5px;text-transform:uppercase;color:#111111;line-height:1.4">{{eyebrow}}</Text>
    <Text if="standfirst" class="dm-m" style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#6b6b70">{{standfirst}}</Text>
    <ul if="items" style="margin:6px 0 18px;padding:0 0 0 18px">
      <li each="items" class="dm-t" style="margin:0 0 14px;padding-left:2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:#333338">
        <strong><Link href="{{url}}" class="dm-h" style="color:#111111;text-decoration:underline">{{headline}}</Link></strong><span if="source" class="dm-m" style="color:#6b6b70;font-size:13px">&nbsp;&middot;&nbsp;{{source}}</span><span if="tag" class="dm-chip" style="display:inline-block;margin-left:6px;padding:1px 7px;border-radius:3px;background-color:#f0f0f2;color:#111111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;vertical-align:middle;line-height:1.6">{{tag}}</span>
        <Text class="dm-t" style="margin:2px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:#333338">{{summary}}</Text>
      </li>
    </ul>
  </div>
</Section>
