<!--
  AAIF User Community newsletter wrapper.

  Header / footer chrome for every edition of the MLOps Community newsletter,
  authored as a declarative template the platform parses into a
  templates_wrappers row. EditionEmail renders the edition body inside the
  <slot name="body" /> below.

  Per-brand URLs (Shop, Subscribe, Slack, YouTube, podcast, X, LinkedIn,
  partner email) are baked into the markup directly — no separate config
  layer. To change them, edit this file and re-apply the source.

  Only runtime fields use {{mustache}}:
    {{edition.date}}             — formatted edition date
    {{edition.view_online_link}} — "View Online" URL (substituted per
                                   recipient at send time via the
                                   {{web_version}} token; empty for the
                                   already-online publish page).
-->

<Section>
  <div style="padding: 15px 0">
    <Text style="margin: 0; text-align: center; font-size: 16px; color: #4086c6">
      <span if="edition.view_online_link">
        <Link href="{{edition.view_online_link}}" style="color: #4086c6; text-decoration: underline">View Online</Link>
      </span>
    </Text>
    <Text if="edition.date" style="margin: 8px 0 0; text-align: center; font-size: 14px; color: #4086c6">
      {{edition.date}}
    </Text>
    <Text style="margin: 8px 0 0; text-align: center; font-size: 12px; color: #4086c6">
      Forwarded this email?
      <Link href="https://aaif.live/newsletters/usercommunity/" style="color: #4086c6; text-decoration: underline">
        Subscribe here
      </Link>
    </Text>
  </div>
</Section>

<slot name="body" />

<Section>
  <div style="padding: 15px 0">
    <Text if="edition.unsubscribe_url" style="margin: 0; text-align: center; font-size: 12px; color: #999">
      <Link href="{{edition.unsubscribe_url}}" style="color: #999; text-decoration: underline">Unsubscribe</Link>
      &middot;
      <Link href="{{edition.manage_subscriptions_url}}" style="color: #999; text-decoration: underline">Manage your email preferences</Link>
    </Text>
  </div>
</Section>
