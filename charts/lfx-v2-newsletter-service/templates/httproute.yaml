{{- if .Values.traefik.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lfx-v2-newsletter-service.fullname" . }}
  labels:
    {{- include "lfx-v2-newsletter-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
      sectionName: {{ .Values.traefik.gateway.sectionName }}
      group: {{ .Values.traefik.gateway.group }}
      kind: {{ .Values.traefik.gateway.kind }}
  {{- if .Values.traefik.hostnames }}
  hostnames:
    {{- range .Values.traefik.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- else }}
  hostnames:
    - {{ printf "%s.%s" (include "lfx-v2-newsletter-service.fullname" .) .Values.lfx.domain | quote }}
  {{- end }}
  rules:
    {{- range .Values.traefik.routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .pathPrefix | quote }}
      {{- if and $.Values.traefik.middleware.enabled $.Values.traefik.middleware.name }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $.Values.traefik.middleware.name }}
      {{- end }}
      backendRefs:
        - name: {{ include "lfx-v2-newsletter-service.fullname" $ }}
          port: {{ .servicePort }}
    {{- end }}
{{- end }}
