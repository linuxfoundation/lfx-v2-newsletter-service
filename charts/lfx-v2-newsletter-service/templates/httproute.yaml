{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.lfx.namespace }}
  labels:
    {{- include "lfx-v2-newsletter-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
  hostnames:
    - "lfx-api.{{ .Values.lfx.domain }}"
  rules:
    - matches:
        - path:
            type: Exact
            value: /newsletters
        - path:
            type: PathPrefix
            value: /newsletters/
        - path:
            type: PathPrefix
            value: /newsletter-analytics/
        - path:
            type: PathPrefix
            value: /newsletter-opens/
      {{- if .Values.heimdall.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall-forward-body
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Chart.Name }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
