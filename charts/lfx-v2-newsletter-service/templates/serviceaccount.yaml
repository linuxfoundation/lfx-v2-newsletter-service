apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lfx-v2-newsletter-service.serviceAccountName" . }}
  labels:
    {{- include "lfx-v2-newsletter-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
