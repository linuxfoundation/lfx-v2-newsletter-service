
# Copyright The Linux Foundation and each contributor to LFX.
# SPDX-License-Identifier: MIT

name: license-header-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  license-header-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Go file headers
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if ! head -n 5 "$file" | grep -q "Copyright The Linux Foundation"; then
              echo "Missing copyright header: $file"
              failed=1
            fi
            if ! head -n 5 "$file" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "Missing SPDX header: $file"
              failed=1
            fi
          done < <(git ls-files '*.go' ':!:gen/**' ':!:bin/**')

          if [[ "$failed" -ne 0 ]]; then
            echo "License header validation failed"
            exit 1
          fi

          echo "License headers validated"
