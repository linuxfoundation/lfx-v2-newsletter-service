---
name: "Newsletter API Build"

"on": [pull_request]

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    # Throwaway database for the Postgres-backed repository tests
    # (internal/repository/postgres_integration_test.go). Those tests skip
    # when NEWSLETTER_TEST_DATABASE_URL is unset, so local `go test ./...`
    # stays green without a database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsletter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Download Dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: make build

      - name: Test
        env:
          NEWSLETTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsletter_test?sslmode=disable
        run: go test ./... -v

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
