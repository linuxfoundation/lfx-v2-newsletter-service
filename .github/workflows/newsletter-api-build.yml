---
name: "Newsletter API Build"

"on": [pull_request]

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    # Throwaway Postgres for the DB-backed tests: the repository tests
    # (internal/repository/postgres_integration_test.go, which skip when
    # NEWSLETTER_TEST_DATABASE_URL is unset) and the tag-gated SendGrid engagement
    # integration tests (schema DDL, upserts, transactions, open-event dedup).
    # Trust auth (no password) keeps a credential-shaped postgres://user:pass@
    # literal out of the workflow for secret scanners.
    services:
      postgres:
        # Pinned by digest: a service container starts before the harden-runner
        # step can constrain it, so a mutable tag would be an unpinned image
        # running early. The tag is kept for readability; the digest is the
        # multi-arch index for postgres:16-alpine.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: newsletter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Download Dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: make build

      - name: Test
        env:
          NEWSLETTER_TEST_DATABASE_URL: postgres://postgres@localhost:5432/newsletter_test?sslmode=disable
        run: go test ./... -v

      - name: Integration test
        env:
          # Passwordless DSN (the Postgres service uses trust auth), so there is no
          # credential-shaped postgres://user:pass@ literal for secret scanners to flag.
          DATABASE_URL: postgres://postgres@localhost:5432/newsletter_test?sslmode=disable
        run: go test -tags integration ./internal/repository/... -v

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
