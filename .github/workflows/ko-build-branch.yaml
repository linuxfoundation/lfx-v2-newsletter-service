name: ko-build-branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ko-build-branch:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Goa CLI
        run: |
          GOTOOLCHAIN=go1.24.10 go install goa.design/goa/v3/cmd/goa@v3.16.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate API code
        run: goa gen github.com/linuxfoundation/lfx-v2-newsletter-service/design

      - name: Setup ko
        uses: ko-build/setup-ko@v0.8

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="sha-${GITHUB_SHA::7}"
          branch_tag="$(echo "${GITHUB_HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$branch_tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: |
          ko build ./cmd/newsletter-api \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --sbom=spdx \
            --tags "${{ steps.tags.outputs.sha_tag }}" \
            --tags "${{ steps.tags.outputs.branch_tag }}"
