name: ko-build-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ko-build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Goa CLI
        run: |
          GOTOOLCHAIN=go1.24.10 go install goa.design/goa/v3/cmd/goa@v3.16.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate API code
        run: goa gen github.com/linuxfoundation/lfx-v2-newsletter-service/design

      - name: Setup ko
        uses: ko-build/setup-ko@v0.8

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: |
          ko build ./cmd/newsletter-api \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --sbom=spdx \
            --tags "sha-${GITHUB_SHA::7}" \
            --tags "development"
