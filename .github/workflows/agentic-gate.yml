# SPDX-License-Identifier: MIT
#
# The gate: the only workflow that reaches a merge verdict. No model runs here. It
# re-derives from the PR's CURRENT head and, when agentic-review/clean is success,
# the needs-human label is absent, and every review thread is resolved with at
# least one reply, records an "approve" verdict.
#
# The thread condition is the tidiness rule: non-blocking findings (nits) do not
# hold the clean status, but the approving review waits until the engineer either
# fixes each one or replies and resolves the thread. Silent resolution does not
# count — a resolved thread with no reply beyond the finding still withholds, so
# no finding is ever dismissed without a recorded reason. Human-authored threads
# are held to the same rule: an unfinished human conversation is not a mergeable
# state for an automated approval.
#
# It triggers on the signals the deterministic apply layer produces with a PAT
# (the agentic-review/clean status and the needs-human label). PAT-generated events
# DO start workflows, unlike GITHUB_TOKEN ones, so triggering on status / labeled
# fires reliably. Thread resolution is a gate input but emits NO workflow event
# (pull_request_review_thread is webhook-only, not an Actions trigger), so a
# scheduled sweep job re-stamps each open PR's existing pr-bound clean status via
# the PAT — every re-stamp fires a real status event that re-runs this evaluation.
# That is what releases the approval after the engineer resolves the last thread,
# and what dismisses it if a thread is un-resolved after approval. The gate
# re-derives from the current head, so a PR that advanced past the reviewed SHA
# fails closed.
#
# The gate is always live: it posts and revokes real approvals. The fail-soft PAT
# fetch is the only thing between it and acting — an unwired repo skips cleanly.
#
# The gate posts an approving review as the lfx-reviewer machine account (a non-author
# with write + a Copilot seat, listed in CODEOWNERS), so the approval counts under
# code-owner branch protection. On a withheld verdict it dismisses any stale
# lfx-reviewer approval, so a PR that regressed past a clean state loses its sign-off.
# It approves or dismisses only; it never merges. A human review is still expected.
#
# The needs-human label is the HUMAN override surface, by design: the escalation
# judge can only raise the flag (the label is sticky and add-only), and a human
# with triage permission removing the label is the sanctioned way to say "I have
# looked, this may proceed". The gate honoring label absence after a human removed
# it is therefore intended behavior, not a bypass — the escalation verdict for the
# current head must still exist, and the clean status must still be green.
---
name: Agentic Gate

# pull_request_target, not pull_request, for the label events: this job holds
# id-token: write and fetches the lfx-reviewer PAT, so its definition must come
# from the DEFAULT branch — a pull_request trigger would run the PR's modified
# copy of this file with those privileges. Safe here because the job never
# checks out or executes PR code. (status events always run the default-branch
# definition already.)
"on":
  status: {}
  pull_request_target:
    types: [labeled, unlabeled]
  # Trusted needs-human verdict comments also gate: a "no" verdict produces no
  # label and no status write, so without this trigger a PR whose clean status
  # landed before the verdict would stay unapproved until some unrelated event.
  issue_comment:
    types: [created]
  # Thread tidiness is a gate input, but resolving/un-resolving a thread emits no
  # workflow event, so the sweep job below re-fires the evaluation on a timer by
  # re-stamping each open PR's clean status (status events run the default-branch
  # definition, so this stays safe for a PAT-holding job).
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.sha || github.run_id }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: this workflow only READS with it (PR, labels,
# commit status). The approve/dismiss steps authenticate with the lfx-reviewer PAT
# fetched from AWS Secrets Manager via OIDC (id-token), whose power comes from the
# PAT, not from these permissions.
permissions:
  contents: read
  pull-requests: read
  issues: read      # escalation verdict comments + needs-human label timeline
  statuses: read
  id-token: write

jobs:
  gate:
    # Only react to the two gating signals: our own agentic-review/clean status (a
    # status event fires for every context, CI statuses too) and the needs-human
    # label (label events fire for every label, so routine label churn is ignored).
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'status' ||
       github.event.context == 'agentic-review/clean') &&
      (github.event_name != 'pull_request_target' ||
       github.event.label.name == 'needs-human') &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'lfx-reviewer' &&
        contains(github.event.comment.body, 'agentic:needs-human')))
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_SHA: ${{ github.event.sha }}
          EVENT_DESC: ${{ github.event.description }}
        run: |
          set -euo pipefail
          PR=""
          if [ -n "$EVENT_PR" ]; then
            PR="$EVENT_PR"
          elif [ -n "$EVENT_SHA" ]; then
            # status event: prefer the PR that apply stamped into the status
            # description (pr=#N), verified open — this keeps the gate alive when
            # one SHA backs several open PRs. Fall back to mapping the commit to
            # its single open PR, else fail closed.
            DESC_PR="$(printf '%s' "$EVENT_DESC" | sed -nE 's/.*pr=#([0-9]+):.*/\1/p')"
            if [ -n "$DESC_PR" ]; then
              STATE="$(gh api "repos/$REPO/pulls/$DESC_PR" --jq '.state' 2>/dev/null || true)"
              [ "$STATE" = "open" ] && PR="$DESC_PR"
            fi
            if [ -z "$PR" ]; then
              PRS="$(gh api "repos/$REPO/commits/$EVENT_SHA/pulls" \
                      --jq '.[] | select(.state=="open") | .number' 2>/dev/null || true)"
              COUNT="$(printf '%s\n' "$PRS" | grep -c . || true)"
              if [ "${COUNT:-0}" -ne 1 ]; then
                echo "status maps to ${COUNT:-0} open PR(s); need exactly one. Not gating."
                echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              PR="$PRS"
            fi
          fi
          if [ -z "$PR" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          HEAD="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          { echo "pr=$PR"; echo "head=$HEAD"; echo "found=true"; } >> "$GITHUB_OUTPUT"

      - name: Evaluate gate
        id: gate
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          # The status must be bound to THIS PR, not just this SHA: one head SHA
          # can back multiple open PRs (same branch, two bases), and PR A's clean
          # must never approve PR B. apply stamps the PR number into the status
          # description; require it here.
          CLEAN="$(gh api "repos/$REPO/commits/$HEAD/status" \
                    --jq ".statuses[] | select(.context==\"agentic-review/clean\" and ((.description // \"\") | contains(\"pr=#$PR:\"))) | .state" \
                    2>/dev/null | head -1 || true)"
          NEEDS_HUMAN="$(gh pr view "$PR" --repo "$REPO" --json labels \
                          --jq 'any(.labels[].name; . == "needs-human")')"
          # The escalation verdict for THIS head must exist AND its content
          # decides: label absence is not a completed "no", because the apply run
          # that sets the label may not have fired yet when the clean status
          # lands. A per-head "yes" verdict withholds until a HUMAN removes the
          # needs-human label AFTER that verdict (the unlabeled event is the
          # sanctioned override; lfx-reviewer never removes labels). The verdict
          # carries a `head:` marker (see /agentic-comment-format), so a stale
          # verdict from an earlier push never vouches for newer commits.
          # Emit per-page lines (--paginate applies --jq per page) and reduce in
          # the shell: latest verdict for this head = last line after sort.
          # Exactly one valid yes/no marker, or the verdict is malformed and
          # withholds: a truncated agent response with the format/head markers
          # but no explicit "no" must never read as a completed "no".
          V="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login==\"lfx-reviewer\" and (.body | contains(\"<!-- agentic:needs-human v1 -->\")) and (.body | contains(\"<!-- head: $HEAD -->\"))) | [.created_at, (if ((.body | contains(\"<!-- needs-human: yes -->\")) and (.body | contains(\"<!-- needs-human: no -->\"))) then \"malformed\" elif (.body | contains(\"<!-- needs-human: yes -->\")) then \"yes\" elif (.body | contains(\"<!-- needs-human: no -->\")) then \"no\" else \"malformed\" end)] | @tsv" \
            2>/dev/null | sort | tail -1 || true)"
          ESC_OK=false
          if [ -n "$V" ]; then
            V_TS="${V%%	*}"; V_VAL="${V##*	}"
            if [ "$V_VAL" = "no" ]; then
              ESC_OK=true
            elif [ "$V_VAL" = "yes" ]; then
              LAST_UNLABEL="$(gh api "repos/$REPO/issues/$PR/timeline" --paginate \
                --jq '.[] | select(.event=="unlabeled" and .label.name=="needs-human" and .actor.login!="lfx-reviewer") | .created_at' \
                2>/dev/null | sort | tail -1 || true)"
              if [ -n "$LAST_UNLABEL" ] && [ "$LAST_UNLABEL" \> "$V_TS" ]; then
                ESC_OK=true
              fi
            fi
          fi
          # Tidiness: every review thread (AI or human) must be resolved, and
          # each must carry at least one reply beyond the finding itself, so a
          # nit is either fixed or resolved with a recorded reason — never
          # dismissed silently. A failed listing fails the step (fail closed);
          # the next gating event re-derives.
          # shellcheck disable=SC2016  # $owner/$name/$pr/$endCursor are GraphQL variables, not shell expansions
          THREADS="$(gh api graphql --paginate \
            -f query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){
              repository(owner:$owner,name:$name){pullRequest(number:$pr){
                reviewThreads(first:100,after:$endCursor){
                  nodes{isResolved comments(first:1){totalCount}}
                  pageInfo{hasNextPage endCursor}}}}}' \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F pr="$PR" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | [(.isResolved|tostring), (.comments.totalCount|tostring)] | @tsv')"
          UNRESOLVED="$(printf '%s\n' "$THREADS" | awk -F'\t' '$1=="false"' | grep -c . || true)"
          SILENT="$(printf '%s\n' "$THREADS" | awk -F'\t' '$1=="true" && ($2+0)<2' | grep -c . || true)"
          THREADS_OK=false
          [ "${UNRESOLVED:-0}" -eq 0 ] && [ "${SILENT:-0}" -eq 0 ] && THREADS_OK=true
          echo "clean=$CLEAN needs-human=$NEEDS_HUMAN escalation=${V:-none} esc_ok=$ESC_OK threads: unresolved=$UNRESOLVED resolved-without-reply=$SILENT (head $HEAD)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ESC_OK" != "true" ]; then
            echo "Escalation verdict for this head is missing, or says yes without a later human override." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$THREADS_OK" != "true" ]; then
            echo "Review threads are not tidy: every thread must be fixed or resolved with a reply before the gate approves." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CLEAN" = "success" ] && [ "$NEEDS_HUMAN" != "true" ] && [ "$ESC_OK" = "true" ] && [ "$THREADS_OK" = "true" ]; then
            echo "approve=true" >> "$GITHUB_OUTPUT"
          else
            echo "approve=false" >> "$GITHUB_OUTPUT"
            echo "Withholding approval." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The write paths below authenticate as lfx-reviewer. Fetch its PAT from AWS
      # Secrets Manager via OIDC (argocd's lfx-one pattern) only when a verdict
      # must be posted or revoked. Fail soft: if the role trust or the secret is
      # not wired yet, the write steps skip instead of erroring.
      - name: Configure AWS credentials
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: arn:aws:iam::788942260905:role/github-actions-deploy
          aws-region: us-east-2

      - name: Get lfx-reviewer token from AWS Secrets Manager
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa # v3
        with:
          secret-ids: |
            GH, /cloudops/managed-secrets/cloud/github/linuxfoundation/lfx-reviewer-pat
          parse-json-secrets: true

      - name: Post approving review (lfx-reviewer)
        if: steps.gate.outputs.approve == 'true'
        env:
          # The Secrets Manager step exports the secret's PAT key as GH_PAT; gh
          # reads GH_TOKEN, so map it here. Empty when the fetch failed soft.
          GH_TOKEN: ${{ env.GH_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "lfx-reviewer PAT unavailable (OIDC role or secret not wired); not approving." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Approve as lfx-reviewer, but only if it has not already approved this exact
          # head, so repeated gate events for the same commit do not stack approvals.
          # Paginate and count matching lines (--paginate applies --jq per page, so
          # the `[...] | length` form would emit one count per page and break).
          already="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq ".[] | select(.user.login==\"lfx-reviewer\" and .state==\"APPROVED\" and .commit_id==\"$HEAD\") | .id" \
            | grep -c . || true)"
          if [ "${already:-0}" -gt 0 ]; then
            echo "lfx-reviewer already approved $HEAD; no-op." >> "$GITHUB_STEP_SUMMARY"
          else
            # Re-validate ALL gate inputs at the last moment, not just the head:
            # status-event and label-event gate runs race on different concurrency
            # keys, so a regression run may have dismissed while this run was
            # queued behind its evaluation. Any change since evaluation aborts
            # (fail closed) — the signal that changed things re-derives on its own.
            esc_ok() {
              # Same rule as Evaluate gate: latest per-head trusted verdict must
              # be an explicit "no", or an explicit "yes" with a later human
              # needs-human unlabel. A malformed verdict (no single valid marker)
              # withholds.
              V="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq ".[] | select(.user.login==\"lfx-reviewer\" and (.body | contains(\"<!-- agentic:needs-human v1 -->\")) and (.body | contains(\"<!-- head: $HEAD -->\"))) | [.created_at, (if ((.body | contains(\"<!-- needs-human: yes -->\")) and (.body | contains(\"<!-- needs-human: no -->\"))) then \"malformed\" elif (.body | contains(\"<!-- needs-human: yes -->\")) then \"yes\" elif (.body | contains(\"<!-- needs-human: no -->\")) then \"no\" else \"malformed\" end)] | @tsv" \
                2>/dev/null | sort | tail -1 || true)"
              [ -n "$V" ] || return 1
              [ "${V##*	}" = "no" ] && return 0
              [ "${V##*	}" = "yes" ] || return 1
              LAST_UNLABEL="$(gh api "repos/$REPO/issues/$PR/timeline" --paginate \
                --jq '.[] | select(.event=="unlabeled" and .label.name=="needs-human" and .actor.login!="lfx-reviewer") | .created_at' \
                2>/dev/null | sort | tail -1 || true)"
              [ -n "$LAST_UNLABEL" ] && [ "$LAST_UNLABEL" \> "${V%%	*}" ]
            }
            threads_ok() {
              # Same rule as Evaluate gate: all threads resolved, each with at
              # least one reply. A failed listing withholds (fail closed).
              # shellcheck disable=SC2016  # $owner/$name/$pr/$endCursor are GraphQL variables, not shell expansions
              T="$(gh api graphql --paginate \
                -f query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){
                  repository(owner:$owner,name:$name){pullRequest(number:$pr){
                    reviewThreads(first:100,after:$endCursor){
                      nodes{isResolved comments(first:1){totalCount}}
                      pageInfo{hasNextPage endCursor}}}}}' \
                -f owner="${REPO%/*}" -f name="${REPO#*/}" -F pr="$PR" \
                --jq '.data.repository.pullRequest.reviewThreads.nodes[] | [(.isResolved|tostring), (.comments.totalCount|tostring)] | @tsv')" || return 1
              BAD="$(printf '%s\n' "$T" | awk -F'\t' '$1=="false" || ($1=="true" && ($2+0)<2)' | grep -c . || true)"
              [ "${BAD:-0}" -eq 0 ]
            }
            recheck() {
              NOW_HEAD="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
              NOW_CLEAN="$(gh api "repos/$REPO/commits/$HEAD/status" \
                --jq ".statuses[] | select(.context==\"agentic-review/clean\" and ((.description // \"\") | contains(\"pr=#$PR:\"))) | .state" \
                2>/dev/null | head -1 || true)"
              NOW_LABEL="$(gh pr view "$PR" --repo "$REPO" --json labels \
                --jq 'any(.labels[].name; . == "needs-human")')"
              [ "$NOW_HEAD" = "$HEAD" ] && [ "$NOW_CLEAN" = "success" ] && [ "$NOW_LABEL" != "true" ] && esc_ok && threads_ok
            }
            if ! recheck; then
              echo "Gate inputs changed since evaluation (head=$NOW_HEAD clean=$NOW_CLEAN needs-human=$NOW_LABEL); not approving." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            RID="$(gh api --method POST "repos/$REPO/pulls/$PR/reviews" \
              -f commit_id="$HEAD" -f event=APPROVE \
              -f body="Agentic gate: no blocking AI-review findings remain, every review thread is resolved with a reply, and no needs-human label is set. Approving on behalf of the automated review; a human review is still expected." \
              --jq '.id')"
            echo "Gate: APPROVED PR #$PR as lfx-reviewer (head $HEAD, review $RID)." >> "$GITHUB_STEP_SUMMARY"
            # Compensating check: if an input regressed in the instant between the
            # re-check and the POST, revoke our own approval right here instead of
            # waiting for the next signal. Together with branch protection's
            # "dismiss stale approvals on push" this closes the approve-time race.
            if ! recheck; then
              gh api --method PUT "repos/$REPO/pulls/$PR/reviews/$RID/dismissals" \
                -f message="Agentic gate: inputs changed while approving; revoking the automated approval." \
                -f event=DISMISS >/dev/null
              echo "Gate: inputs regressed during approval; self-dismissed review $RID." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Dismiss stale approval (withheld verdict)
        if: steps.gate.outputs.approve == 'false' && steps.pr.outputs.found == 'true'
        env:
          # The Secrets Manager step exports the secret's PAT key as GH_PAT; gh
          # reads GH_TOKEN, so map it here. Empty when the fetch failed soft.
          GH_TOKEN: ${{ env.GH_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "lfx-reviewer PAT unavailable (OIDC role or secret not wired); nothing dismissed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # If lfx-reviewer approved earlier but the PR has since regressed (a blocking
          # finding reappeared, needs-human was set, or a new commit is not yet clean),
          # revoke that approval so the gate never leaves stale sign-off on the PR.
          # This step is the safety backstop, so it fails LOUDLY: a failed listing or
          # a failed dismissal fails the job (bash -e), never a silent green.
          ids="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.login=="lfx-reviewer" and .state=="APPROVED") | .id')"
          if [ -z "$ids" ]; then
            echo "Gate: WITHHOLD (no prior lfx-reviewer approval to dismiss)." >> "$GITHUB_STEP_SUMMARY"
          else
            for id in $ids; do
              gh api --method PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                -f message="Agentic gate: PR is no longer clean, has open or silently-resolved review threads, or now needs a human; dismissing the automated approval." \
                -f event=DISMISS >/dev/null
              echo "dismissed review $id" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  # Thread resolves/unresolves emit no workflow event, so this job is the gate's
  # liveness backstop: on a timer it re-stamps each open PR's existing pr-bound
  # agentic-review/clean status verbatim (statuses are append-only, so the POST
  # fires a fresh status event) and the gate job above re-evaluates that PR. It
  # invents nothing: a PR that never had a conductor status is left alone, so a
  # sweep can never move a gate the pipeline has not touched.
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: arn:aws:iam::788942260905:role/github-actions-deploy
          aws-region: us-east-2

      - name: Get lfx-reviewer token from AWS Secrets Manager
        continue-on-error: true
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa # v3
        with:
          secret-ids: |
            GH, /cloudops/managed-secrets/cloud/github/linuxfoundation/lfx-reviewer-pat
          parse-json-secrets: true

      - name: Re-stamp clean statuses to re-fire evaluation
        env:
          GH_TOKEN: ${{ env.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "lfx-reviewer PAT unavailable (OIDC role or secret not wired); nothing swept." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for PR in $(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[].number'); do
            HEAD="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            # Latest pr-bound conductor status on the current head, if any. The
            # combined-status endpoint returns the newest status per context, so
            # this re-stamps the live verdict, never a superseded one.
            S="$(gh api "repos/$REPO/commits/$HEAD/status" \
                  --jq ".statuses[] | select(.context==\"agentic-review/clean\" and ((.description // \"\") | contains(\"pr=#$PR:\"))) | [.state, .description] | @tsv" \
                  2>/dev/null | head -1 || true)"
            [ -n "$S" ] || continue
            STATE="${S%%	*}"; DESC="${S##*	}"
            gh api --method POST "repos/$REPO/statuses/$HEAD" \
              -f state="$STATE" -f context=agentic-review/clean -f description="$DESC" >/dev/null
            echo "re-stamped pr=#$PR head=$HEAD state=$STATE" >> "$GITHUB_STEP_SUMMARY"
          done
