# SPDX-License-Identifier: MIT
#
# On PR open: fire the needs-human escalation as an Agent Tasks API task pinned to
# gpt-5.5. It runs the escalation and posts its needs-human verdict comment via the
# writable GitHub MCP (add_issue_comment). The native review is requested by
# agentic-conductor, which also waits for it before firing its own per-round
# reconcile task.
#
# We do NOT poll or wait here. The repo has "require approval for Copilot workflow
# runs" turned OFF, so the agent's own comment triggers agentic-apply.yml, which
# reads the verdict and sets the sticky needs-human label. Fire and forget.
#
# Runs as the lfx-reviewer machine account (write + a Copilot seat, to request the
# reviewer and start the task). The PAT is fetched at runtime from AWS Secrets
# Manager via OIDC — the same pattern lfx-v2-argocd uses for the lfx-one PAT — so
# no GitHub secret is provisioned per repo.
---
name: Agentic Escalation (open)

"on":
  pull_request:
    types: [opened, reopened]

# id-token is what lets the job assume the AWS role via OIDC; everything the job
# writes on GitHub goes through the fetched PAT, not the workflow token.
permissions:
  id-token: write

concurrency:
  group: agentic-escalation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  escalate:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      # Fail soft: until the OIDC role trust covers this repo (and on fork PRs,
      # which get no id-token), these steps error and the guard below skips the
      # job green, so the setup can merge before the wiring exists.
      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: arn:aws:iam::788942260905:role/github-actions-deploy
          aws-region: us-east-2

      - name: Get lfx-reviewer token from AWS Secrets Manager
        continue-on-error: true
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa # v3
        with:
          secret-ids: |
            GH, /cloudops/managed-secrets/cloud/github/linuxfoundation/lfx-reviewer-pat
          parse-json-secrets: true

      - name: Check reviewer PAT
        id: cfg
        run: |
          # The Secrets Manager step exports the secret's `token` key as GH_TOKEN
          # for the remaining steps. Skip (green) when it is not available.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "lfx-reviewer PAT unavailable (OIDC role or secret not wired); agentic escalation skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire escalation task (gpt-5.5) — posts the needs-human verdict
        if: steps.cfg.outputs.present == 'true'
        run: |
          TID=$(gh api "/agents/repos/$REPO/tasks" \
            -H "X-GitHub-Api-Version: 2026-03-10" --method POST \
            -f model=gpt-5.5 -F create_pull_request=false \
            -f base_ref="$BASE_REF" -f head_ref="$HEAD_REF" \
            -f prompt="Run the needs-human escalation for pull request #$PR in $REPO, following the repository instructions exactly. Post your machine-readable needs-human verdict comment using the add_issue_comment tool." \
            --jq '.id')
          echo "escalation task: $TID (seeds the gpt-5.5 session; agentic-apply reacts to its comment)"
